name: kinsu_health
description: A basic iOS health app with BP/pulse, prescriptions, and next doses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  http: ^1.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: ^27.2.5
  dio: ^5.4.0
  provider: ^6.1.1
  firebase_core: ^2.25.0
  firebase_auth: ^4.17.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

